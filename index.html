<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interrail Expense Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
<div class="max-w-4xl mx-auto space-y-8">
<header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
<div>
<h1 class="text-2xl font-bold text-slate-900">InterRail - Despesas</h1>
<p class="text-sm text-slate-500">Contabilidade rigorosa para evitar dramas.</p>
</div>
<div class="flex items-center gap-4">
<div class="flex gap-4 text-center">
<div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
<span class="block text-xs text-slate-400 uppercase font-semibold">Total Gasto</span>
<span id="totalSpent" class="text-lg font-bold text-slate-900">0.00 €</span>
</div>
<div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
<span class="block text-xs text-slate-400 uppercase font-semibold">Por Pessoa</span>
<span id="perPerson" class="text-lg font-bold text-indigo-600">0.00 €</span>
</div>
</div>
</div>
</header>

<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
<div class="text-sm text-slate-600 font-medium">Sincronização entre Dispositivos:</div>
<div class="flex gap-3">
<button onclick="exportData()" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition duration-200">Exportar Backup</button>
<label class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition duration-200 cursor-pointer">
Importar Backup
<input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
</label>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 md:col-span-1 h-fit">
<h2 class="text-lg font-semibold text-slate-900 mb-4">Adicionar Despesa</h2>
<form id="expenseForm" class="space-y-4">
<div>
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Data</label>
<input type="date" id="expenseDate" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Dia do Interrail</label>
<input type="number" id="expenseDay" min="1" placeholder="Ex: 1" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tipo</label>
<input type="text" id="expenseType" placeholder="Ex: Comboio, Cerveja, Gelado" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Descrição</label>
<input type="text" id="expenseDescription" placeholder="Ex: Bilhete de Berlim" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
</div>
<div>
<label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Total (€)</label>
<input type="number" step="0.01" id="expenseTotal" placeholder="0.00" required class="w-full p-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
</div>
<button type="submit" class="w-full bg-indigo-600 text-white font-semibold p-2.5 rounded-xl hover:bg-indigo-700 transition duration-200 text-sm">Registar Custo</button>
</form>
</div>

<div class="space-y-8 md:col-span-2">
<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
<h2 class="text-lg font-semibold text-slate-900 mb-4">Estatísticas por Tipo</h2>
<div class="relative h-64 flex justify-center items-center">
<canvas id="expenseChart"></canvas>
</div>
</div>

<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
<h2 class="text-lg font-semibold text-slate-900 mb-4">Histórico de Despesas</h2>
<div class="overflow-x-auto">
<table class="w-full text-left text-sm">
<thead class="bg-slate-50 border-b border-slate-200 text-slate-400 uppercase text-xs">
<tr>
<th class="p-3">Data / Dia</th>
<th class="p-3">Tipo</th>
<th class="p-3">Descrição</th>
<th class="p-3">Total</th>
<th class="p-3">Metade</th>
<th class="p-3 text-right">Ações</th>
</tr>
</thead>
<tbody id="expenseTableBody" class="divide-y divide-slate-100">
</tbody>
</table>
</div>
</div>
</div>
</div>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem('interrail_expenses')) || [];
let expenseChartInstance = null;

const expenseForm = document.getElementById('expenseForm');
const expenseTableBody = document.getElementById('expenseTableBody');
const totalSpentEl = document.getElementById('totalSpent');
const perPersonEl = document.getElementById('perPerson');

function saveData() {
localStorage.setItem('interrail_expenses', JSON.stringify(expenses));
}

function renderApp() {
expenseTableBody.innerHTML = '';
let totalSum = 0;

expenses.sort((a, b) => new Date(b.date) - new Date(a.date));

expenses.forEach((expense, index) => {
totalSum += parseFloat(expense.total);
const half = (expense.total / 2).toFixed(2);
const row = document.createElement('tr');
row.innerHTML = `
<td class="p-3"><div class="font-semibold text-slate-900">${expense.date}</div><div class="text-xs text-slate-400">Dia ${expense.day}</div></td>
<td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">${expense.type}</span></td>
<td class="p-3 text-slate-600">${expense.description}</td>
<td class="p-3 font-semibold text-slate-900">${parseFloat(expense.total).toFixed(2)} €</td>
<td class="p-3 text-indigo-600 font-semibold">${half} €</td>
<td class="p-3 text-right"><button onclick="deleteExpense(${index})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">Apagar</button></td>
`;
expenseTableBody.appendChild(row);
});

totalSpentEl.textContent = `${totalSum.toFixed(2)} €`;
perPersonEl.textContent = `${(totalSum / 2).toFixed(2)} €`;

updateChart();
}

function deleteExpense(index) {
expenses.splice(index, 1);
saveData();
renderApp();
}

function exportData() {
const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(expenses));
const downloadAnchor = document.createElement('a');
downloadAnchor.setAttribute("href", dataStr);
downloadAnchor.setAttribute("download", "interrail_backup.json");
document.body.appendChild(downloadAnchor);
downloadAnchor.click();
downloadAnchor.remove();
}

function importData(event) {
const fileReader = new FileReader();
if (event.target.files[0]) {
fileReader.readAsText(event.target.files[0], "UTF-8");
fileReader.onload = (e) => {
try {
const importedExpenses = JSON.parse(e.target.result);
if (Array.isArray(importedExpenses)) {
expenses = importedExpenses;
saveData();
renderApp();
alert("Dados importados com sucesso!");
} else {
alert("Formato de ficheiro inválido.");
}
} catch (error) {
alert("Erro ao ler o ficheiro.");
}
};
}
}

function updateChart() {
const categories = {};
expenses.forEach(exp => {
categories[exp.type] = (categories[exp.type] || 0) + parseFloat(exp.total);
});

const sortedCategories = Object.entries(categories).sort((a, b) => b[1] - a[1]);
const labels = sortedCategories.map(item => item[0]);
const data = sortedCategories.map(item => item[1]);

const ctx = document.getElementById('expenseChart').getContext('2d');
if (expenseChartInstance) {
expenseChartInstance.destroy();
}

expenseChartInstance = new Chart(ctx, {
type: 'doughnut',
data: {
labels: labels,
datasets: [{
data: data,
backgroundColor: ['#4f46e5', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'],
borderWidth: 0
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: {
legend: {
position: 'bottom'
}
}
}
});
}

expenseForm.addEventListener('submit', (e) => {
e.preventDefault();
const newExpense = {
date: document.getElementById('expenseDate').value,
day: document.getElementById('expenseDay',).value,
type: document.getElementById('expenseType').value.trim(),
description: document.getElementById('expenseDescription').value,
total: parseFloat(document.getElementById('expenseTotal').value)
};
expenses.push(newExpense);
saveData();
renderApp();
expenseForm.reset();
});

renderApp();
</script>
</body>
</html>
